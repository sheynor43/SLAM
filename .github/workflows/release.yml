name: Release

# Builds the Linux AppImage and the Windows portable zip for a `v*` tag and publishes them
# as a pre-release (ADR-0068).
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # appimagetool and the AppImage runtime, pinned with their checksums.
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
  RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

permissions:
  contents: read

jobs:
  linux:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The same packages as in CI: SDL3 video drivers, D-Bus for the portal folder picker,
      # PipeWire and libclang for its bindings.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libpipewire-0.3-dev libclang-dev
      - name: Install toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --release -p slam-app --locked
      - name: Fetch appimagetool
        run: |
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL -o runtime "$RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c
          echo "$RUNTIME_SHA256  runtime" | sha256sum -c
          chmod +x appimagetool
      - name: Build AppImage
        env:
          # Runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          app=SLAM.AppDir
          mkdir -p "$app/usr/bin" "$app/usr/share/doc/slam"
          cp target/release/slam "$app/usr/bin/slam"
          cp packaging/linux/slam.desktop "$app/slam.desktop"
          cp packaging/linux/AppRun "$app/AppRun"
          chmod +x "$app/AppRun"
          cp assets/icon/slam.png "$app/slam.png"
          ln -s slam.png "$app/.DirIcon"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES "$app/usr/share/doc/slam/"
          cp assets/default-skin/LICENCE.md "$app/usr/share/doc/slam/DEFAULT_SKIN_LICENCE.md"
          cp assets/default-skin/README.md "$app/usr/share/doc/slam/DEFAULT_SKIN_README.md"
          cp packaging/release-notes.md "$app/usr/share/doc/slam/README.md"
          ./scripts/release-check.sh "$app"
          ./appimagetool --runtime-file runtime --no-appstream "$app" "SLAM-${GITHUB_REF_NAME}-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: SLAM-*.AppImage
          if-no-files-found: error

  windows:
    name: Portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --release -p slam-app --locked
      - name: Pack
        shell: bash
        run: |
          dir="SLAM-${GITHUB_REF_NAME}-windows-x64"
          mkdir "$dir"
          cp target/release/slam.exe "$dir/"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES "$dir/"
          cp assets/default-skin/LICENCE.md "$dir/DEFAULT_SKIN_LICENCE.md"
          cp assets/default-skin/README.md "$dir/DEFAULT_SKIN_README.md"
          cp packaging/release-notes.md "$dir/README.md"
          ./scripts/release-check.sh "$dir"
          7z a -tzip "$dir.zip" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: SLAM-*.zip
          if-no-files-found: error

  publish:
    name: Publish pre-release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "SLAM $GITHUB_REF_NAME" --notes-file packaging/release-notes.md \
            SLAM-*.AppImage SLAM-*.zip

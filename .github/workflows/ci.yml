name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SDL3 is built from source (sdl3-sys build-from-source-static) with the same
      # X11 and Wayland video drivers as release builds; CMake refuses to configure
      # without their headers.
      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev
      # slam-audio: PipeWire headers; pipewire-sys generates bindings with bindgen
      # (libclang).
      - name: Install PipeWire build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libclang-dev
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (Tracy)
        run: cargo clippy -p slam-engine --all-targets --features tracy -- -D warnings
      - name: Clippy (Windows)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

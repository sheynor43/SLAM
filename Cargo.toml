[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheynor43/SLAM"
publish = false

[workspace.dependencies]
libc = "0.2.190"
glow = "0.18.0"
# Linux audio backend; 1.0 is the oldest supported libpipewire (Ubuntu 24.04).
pipewire = { version = "0.10.1", features = ["v1_0_0"] }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "glsl-out"] }
rtrb = "0.4.0"
sdl3-sys = { version = "0.7.2", default-features = false }
thiserror = "2.0.21"
# Started explicitly, records only while a viewer is connected, local viewer only.
tracy-client = { version = "0.19.0", default-features = false, features = ["enable", "manual-lifetime", "ondemand", "only-localhost"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Performance", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheynor43/SLAM"
publish = false

[workspace.dependencies]
# Correctly rounded transcendental functions for gameplay (ADR-0031); pinned exactly.
pxfm = "=0.1.30"
# Corpus harness manifests (slam-osu tests).
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "display"] }
serde = { version = "1", features = ["derive"] }
# Corpus harness: SHA-256 of map files (slam-osu tests).
sha2 = "0.11.0"
# MD5 of beatmap files for the replays of live plays (lazer matches a replay to its beatmap by it).
md-5 = { version = "0.11.0", default-features = false }
libc = "0.2.190"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
glow = "0.18.0"
# Raw LZMA coder for the compressed frame data of .osr replays.
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "encoder", "optimization"] }
# Linux audio backend; 1.0 is the oldest supported libpipewire (Ubuntu 24.04).
pipewire = { version = "0.10.1", features = ["v1_0_0"] }
# Property tests of slider geometry.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "glsl-out"] }
rtrb = "0.4.0"
# Skin and background images (ADR-0034).
png = "0.18.1"
# JPEG backgrounds and skin images (ADR-0040).
zune-jpeg = "0.5.15"
# JSON of the lazer score-info block in .osr replays; insertion order is kept to write fields back as read.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Offline resampling of hitsounds to the device rate.
rubato = { version = "5.0.1", default-features = false, features = ["fft_resampler"] }
# Hitsound formats accepted by stable: WAV (PCM, ADPCM), OGG Vorbis, MP3.
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "adpcm", "ogg", "vorbis", "mp3", "opt-simd"] }
# Pitch-preserving time-stretch of the music track (C++, built with cc; ADR-0036).
signalsmith-stretch = "=0.1.3"
sdl3-sys = { version = "0.7.2", default-features = false }
thiserror = "2.0.21"
# .osz/.osk archives: deflate in pure Rust plus deflate64 from old Windows Explorer archives (ADR-0030).
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
# Shift-JIS (CP932) decoding of file names in stable archives.
encoding_rs = "0.8.42"
# Checksums of hand-built zip archives in slam-formats tests.
crc32fast = "1.5.0"
# Started explicitly, records only while a viewer is connected, local viewer only.
tracy-client = { version = "0.19.0", default-features = false, features = ["enable", "manual-lifetime", "ondemand", "only-localhost"] }
tracing = "0.1.44"
# Fluent localization (ADR-0011); the concurrent bundle keeps the localizer Send + Sync.
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
# Text shaping (ADR-0037).
harfrust = "0.14.0"
# Font tables, metrics, charmap and variations (ADR-0037); re-exports read-fonts.
skrifa = "0.48.0"
# Multi-channel signed distance fields of glyph outlines (ADR-0037); pure Rust.
# UAX #14 line break opportunities for text layout (ADR-0037).
unicode-linebreak = "0.1.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }
# COM interfaces for the WASAPI backend (windows-sys has no COM wrappers).
windows = { version = "0.62.2", features = ["Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Performance", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The time-stretch is C++ built by `cc` with the profile's opt-level: unoptimized it
# cannot keep up with real time, even in tests.
[profile.dev.package.signalsmith-stretch]
opt-level = 3

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheynor43/SLAM"
publish = false

[workspace.dependencies]
libc = "0.2.190"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
glow = "0.18.0"
# Raw LZMA coder for the compressed frame data of .osr replays.
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "encoder", "optimization"] }
# Linux audio backend; 1.0 is the oldest supported libpipewire (Ubuntu 24.04).
pipewire = { version = "0.10.1", features = ["v1_0_0"] }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "glsl-out"] }
rtrb = "0.4.0"
# JSON of the lazer score-info block in .osr replays; insertion order is kept to write fields back as read.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Offline resampling of hitsounds to the device rate.
rubato = { version = "5.0.1", default-features = false, features = ["fft_resampler"] }
# Hitsound formats accepted by stable: WAV (PCM, ADPCM), OGG Vorbis, MP3.
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "adpcm", "ogg", "vorbis", "mp3", "opt-simd"] }
sdl3-sys = { version = "0.7.2", default-features = false }
thiserror = "2.0.21"
# Started explicitly, records only while a viewer is connected, local viewer only.
tracy-client = { version = "0.19.0", default-features = false, features = ["enable", "manual-lifetime", "ondemand", "only-localhost"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }
# COM interfaces for the WASAPI backend (windows-sys has no COM wrappers).
windows = { version = "0.62.2", features = ["Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Performance", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

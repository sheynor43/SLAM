# Gameplay math goes through `crate::math` (ADR-0031): the platform libm differs between systems.
# `powi` is not correctly rounded and LLVM folds it differently in release builds; `mul_add`
# without the `fma` target feature calls the platform `fma`.
disallowed-methods = [
    { path = "f64::sin", reason = "use crate::math (ADR-0031)" },
    { path = "f64::cos", reason = "use crate::math (ADR-0031)" },
    { path = "f64::tan", reason = "use crate::math (ADR-0031)" },
    { path = "f64::sin_cos", reason = "use crate::math (ADR-0031)" },

[package]
name = "slam-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glow.workspace = true
png.workspace = true
rtrb.workspace = true
thiserror.workspace = true
tracing.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
slam-testkit = { path = "../slam-testkit" }

# criterion needs a C compiler for the target (`alloca`); the Windows cross check has
# none, so benches build on non-Windows targets only.
[target.'cfg(not(windows))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "slider_mesh"
harness = false

[build-dependencies]
slam-shader-build = { path = "../slam-shader-build" }

[lints]
workspace = true
